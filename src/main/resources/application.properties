# 内嵌 H2（本地文件库，重启后数据保留，便于本地验证审计与重放）
spring.datasource.url=jdbc:h2:file:./data/settlement-ledger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 不依赖 spring 的自动 schema 初始化，结构由 SchemaInitializer 版本化迁移自举
spring.sql.init.mode=never

server.port=8080
logging.level.com.github.lisama569=INFO
