# 默认即为持久化文件库：无论用哪种方式启动（含直接 mvn spring-boot:run / java -jar），
# 进程停掉（甚至被直接 kill -9）再起来，指令、审计历史与归档数据都还在。
# WRITE_DELAY=0 让每个已提交事务立即 fsync 落盘，避免 OS/进程崩溃丢失最后一段已确认写入。
spring.datasource.url=jdbc:h2:file:./data/settlement;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 已有数据文件时只做增量 schema 更新，绝不 drop，避免重启清库
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
