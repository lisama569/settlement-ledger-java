# 默认即文件型 H2：任何启动方式（mvn spring-boot:run、java -jar、IDE 直接运行）
# 都把数据落到 ./data/settlement.mv.db，进程退出（含 kill -9）后重启数据仍在。
# WRITE_DELAY=0 关闭提交攒批：每个已提交事务立即 fsync，保证成功返回的受理/推进不丢。
# FILE_LOCK=NO 避免旧进程异常退出后遗留锁文件导致下次启动报数据库被占用
# （单进程本地服务，文件锁非必需；H2 自身的提交日志保证文件一致性）。
spring.datasource.url=jdbc:h2:file:./data/settlement;WRITE_DELAY=0;FILE_LOCK=NO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 已有数据文件时只增量建表，不做 drop/create，避免重启清库
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 停止时等待在途请求正常收尾（优雅停机不改变已提交数据，文件库本身不受影响）
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
