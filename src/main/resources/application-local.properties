# 本地持久化 profile：文件型 H2，进程重启后指令与审计历史（含归档表）仍在。
# 用法：mvn spring-boot:run -Dspring-boot.run.profiles=local
# 默认 profile 现在同样是文件库且已开启同步落盘；local profile 额外开 AUTO_SERVER，
# 允许排查时用另一个进程（如 H2 工具）并发打开同一个数据文件。
# WRITE_DELAY=0：事务提交即 fsync，进程被 kill -9 也不丢已确认的受理/推进。
spring.datasource.url=jdbc:h2:file:./data/settlement;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 已有数据文件时用 update，不做 drop，避免重启清库
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
