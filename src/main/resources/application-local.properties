# 本地持久化 profile：文件型 H2，进程重启后指令与审计历史（含归档表）仍在。
# 用法：mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/settlement;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 已有数据文件时用 update，不做 drop，避免重启清库
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
